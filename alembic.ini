# Alembic configuration for the kidney-risk research database.
#
# The database URL is NOT stored here — it is read from the DATABASE_URL
# environment variable (see backend/database/migrations/env.py), so credentials
# never live in version control.
#
# Common commands (run from the repo root, venv active):
#   alembic upgrade head            # apply all migrations
#   alembic revision --autogenerate -m "add table x"   # after editing models
#   alembic downgrade -1            # roll back one migration
#   alembic current                 # show applied revision

[alembic]
script_location = backend/database/migrations
prepend_sys_path = .
# Use OS path separators so revision files import cleanly on Windows.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
